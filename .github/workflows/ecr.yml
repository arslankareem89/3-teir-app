name: Deploy to ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  ECS_CLUSTER: 3-tier-app-cluster
  ECR_REGISTRY: 707575990308.dkr.ecr.ap-south-1.amazonaws.com
  FRONTEND_REPO: 3-tier-app-frontend
  BACKEND_REPO: 3-tier-app-backend
  FRONTEND_SERVICE: 3-tier-app-frontend-service
  BACKEND_SERVICE: 3-tier-app-backend-service

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: image-tag
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend image
        run: |
          docker build \
            -t "${ECR_REGISTRY}/${FRONTEND_REPO}:${{ steps.image-tag.outputs.tag }}" \
            ./app/frontend

          docker push "${ECR_REGISTRY}/${FRONTEND_REPO}:${{ steps.image-tag.outputs.tag }}"

      - name: Build and push backend image
        run: |
          docker build \
            -t "${ECR_REGISTRY}/${BACKEND_REPO}:${{ steps.image-tag.outputs.tag }}" \
            ./app/backend

          docker push "${ECR_REGISTRY}/${BACKEND_REPO}:${{ steps.image-tag.outputs.tag }}"

      - name: Update frontend task definition
        id: frontend-task
        env:
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        run: |
          aws ecs describe-task-definition \
            --task-definition 3-tier-app-frontend \
            --query taskDefinition \
            --output json > "$RUNNER_TEMP/frontend-task.json"

          jq \
            --arg image "${ECR_REGISTRY}/${FRONTEND_REPO}:${IMAGE_TAG}" \
            '(.containerDefinitions[] | select(.name == "frontend").image) = $image
             | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                   .compatibilities, .registeredAt, .registeredBy)' \
            "$RUNNER_TEMP/frontend-task.json" > "$RUNNER_TEMP/frontend-task-updated.json"

          arn=$(aws ecs register-task-definition \
            --cli-input-json "file://$RUNNER_TEMP/frontend-task-updated.json" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "arn=$arn" >> "$GITHUB_OUTPUT"

      - name: Update backend task definition
        id: backend-task
        env:
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        run: |
          aws ecs describe-task-definition \
            --task-definition 3-tier-app-backend \
            --query taskDefinition \
            --output json > "$RUNNER_TEMP/backend-task.json"

          jq \
            --arg image "${ECR_REGISTRY}/${BACKEND_REPO}:${IMAGE_TAG}" \
            '(.containerDefinitions[] | select(.name == "backend").image) = $image
             | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                   .compatibilities, .registeredAt, .registeredBy)' \
            "$RUNNER_TEMP/backend-task.json" > "$RUNNER_TEMP/backend-task-updated.json"

          arn=$(aws ecs register-task-definition \
            --cli-input-json "file://$RUNNER_TEMP/backend-task-updated.json" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "arn=$arn" >> "$GITHUB_OUTPUT"

      - name: Run database migrations
        env:
          BACKEND_TASK_DEFINITION: ${{ steps.backend-task.outputs.arn }}
        run: |
          set -euo pipefail

          network=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$BACKEND_SERVICE" \
            --query 'services[0].networkConfiguration.awsvpcConfiguration' \
            --output json)

          task_arn=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$BACKEND_TASK_DEFINITION" \
            --launch-type FARGATE \
            --network-configuration "$network" \
            --overrides '{"containerOverrides":[{"name":"backend","command":["alembic","upgrade","head"]}]}' \
            --query 'tasks[0].taskArn' \
            --output text)

          if [[ -z "$task_arn" || "$task_arn" == "None" ]]; then
            echo "Migration task did not start."
            exit 1
          fi

          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$task_arn"

          exit_code=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$task_arn" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)

          if [[ "$exit_code" != "0" ]]; then
            aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$task_arn"
            echo "Migration task exited with code $exit_code"
            exit 1
          fi

      - name: Deploy backend service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$BACKEND_SERVICE" \
            --task-definition "${{ steps.backend-task.outputs.arn }}" \
            --no-cli-pager

      - name: Deploy frontend service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$FRONTEND_SERVICE" \
            --task-definition "${{ steps.frontend-task.outputs.arn }}" \
            --no-cli-pager

      - name: Wait for services to become stable
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$BACKEND_SERVICE" "$FRONTEND_SERVICE"