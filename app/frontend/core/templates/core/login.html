{% extends "core/base.html" %}

{% block content %}

<div class="card">
    <h1>Welcome back</h1>
    <p class="subtitle">
        Sign in to continue to your account.
    </p>

    {% if registered %}
        <div class="success">
            Account created successfully. Please log in.
        </div>
    {% endif %}

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <label>Email</label>
        <input
            type="email"
            name="email"
            placeholder="arslan@example.com"
            required
        >

        <label>Password</label>
        <input
            type="password"
            name="password"
            placeholder="••••••••"
            required
        >

        <button type="submit">Login</button>
    </form>

    <div class="link">
        Don't have an account?
        <a href="/register/">Create one</a>
    </div>
</div>

{% endblock %}
